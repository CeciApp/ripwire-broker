[package]
name = "ripwire-broker"
version = "0.1.0"
edition = "2024"
license = "MIT"
# Two binaries since D-116: the broker, and `ripwire-eval`, the A/B instrument.
default-run = "ripwire-broker"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rust-mcp-sdk = { version = "=2.0.0", default-features = false, features = [
  "server",
  "client",
  "macros",
  "stdio"
] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ignore = "0.4"
tokio-util = "0.7"
secrecy = { version = "0.10", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
# Visual width of the status line (PRD §24.5.3, D-123): no deps, no network.
unicode-width = "0.2"
# `O_NOFOLLOW` and `O_NONBLOCK` for the private files (D-127). Already in the graph through
# tokio and sha2: no new crate, no unsafe.
libc = "0.2"
# `openat` for the workspace reader, one component at a time without following links (D-152):
# std has no `openat`, and the crate forbids `unsafe`. Already in the graph through tempfile;
# no network.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[features]
# The remote classifier's HTTP client (PRD §23, D-059). Off by default: the default build
# has no network stack (CA-10).
online = ["dep:secrecy", "dep:reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# The HTTP/2 fixture of tests/online_protocol.rs. Already in the graph through reqwest's
# `http2`; a dev-dependency never reaches the default build (CA-10 checks `-e normal`).
h2 = "0.4"
tempfile = "3"
proptest = "1.11.0"
