[package]
name = "ripwire-broker"
version = "0.1.0"
edition = "2024"

[dependencies]
rust-mcp-sdk = { version = "=2.0.0", default-features = false, features = [
  "server",
  "client",
  "macros",
  "stdio"
] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }

[dev-dependencies]
tempfile = "3"
